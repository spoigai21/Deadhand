[project]
name = "deadhead"
version = "0.0.1"
description = "A real-time ride-matching service on a real day of New York demand, sharded by map cell and measured under failure."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "osmnx>=2.0",
    "h3>=4.0",
    "requests>=2.32",
    "matplotlib>=3.9",
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deadhead"]
