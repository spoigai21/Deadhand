# Phase 4 — batching, on the oracle and on the service. Inherits the Phase 3 model (deterministic cruise point, 8 partitions,
# resolution-6 key); nothing tunable lives in code.
seed: 0
seeds: [0, 1, 2, 3, 4]
osrm: http://localhost:5001
kafka: localhost:9092
hardware_lane: cpu-apple-m5
trips_dir: data/tlc/opendata
crossings_geojson: results/phase0/water_crossings.geojson
days: ["2016-06-16", "2016-06-18"]
partitions: 8
key_resolution: 6
h3_resolution: 8
ring_k: 3                               # the matching radius: candidates come from this many rings around the pickup cell (about 2 km)
candidates_k: 50
fleet_size: 7500
abandon_after_s: 600
initial_positions_window_s: 3600
repositioning: cruise
cruise_after_s: 300
cruise_ring_k: 5
straight_line_speed_mps: 8.243
replay_speed: max
phase_dir: phase4
cruise_point: hash
# batching
windows_s: [0, 2, 5, 10, 20, 30, 60, 120]   # W: the tumbling event-time window; 0 is the Phase 3 reference oracle (data/phase3/assignments_ref_*); 120 was added after the rule reached the edge of the planned grid at 60
radius_rings: [2, 3, 5]                 # the matching radius sensitivity, at W = 0 and at the operating point
operating_point_seeds: [0, 1, 2, 3, 4]  # the operating point is replayed with every seed; the sweep with seed 0
batch_shards: ["s6n4", "s8n4"]          # Mode A under batching: the shard solve for (key resolution 6, 4 workers) and (8, 4)
# the service with the window
service_workers: 4
service_windows_s: [10]                 # the worker's window for the Mode B comparison against the batched oracle
watermark_slack_s: 30
session_timeout_ms: 6000
heartbeat_interval_ms: 2000
