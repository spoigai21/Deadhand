# Phase 3 — the service: a Java consumer group sharded by H3 cell. Inherits the Phase 2 model; nothing tunable lives in code.
seed: 0
seeds: [0, 1, 2, 3, 4]
osrm: http://localhost:5001
kafka: localhost:9092
hardware_lane: cpu-apple-m5
trips_dir: data/tlc/opendata
crossings_geojson: results/phase0/water_crossings.geojson
days: ["2016-06-16", "2016-06-18"]
partitions: 8
key_resolution: 6                       # the stream key (SPEC.md): workers own regions of resolution-6 cells; 7 is the sensitivity
key_resolution_sensitivity: [7]
h3_resolution: 8
ring_k: 3
candidates_k: 50
fleet_size: 7500
abandon_after_s: 600
initial_positions_window_s: 3600
repositioning: cruise
cruise_after_s: 300
cruise_ring_k: 5
straight_line_speed_mps: 8.243
replay_speed: max
# the reference oracle for this phase: same model as Phase 2 with a deterministic cruise point, so the Java worker is an exact mirror
phase_dir: phase3
cruise_point: hash                      # a real pickup chosen by hash of (driver, cruise count), not by the RNG (Phase 2)
shard_key_resolutions: [5, 6, 7, 8]     # Mode A: Finding 2 by region size (the key resolution)
shard_workers: [2, 4, 8]                # Mode A: Finding 2 by worker count (RangeAssignor over the 8 partitions)
# the service
workers: [1, 2, 4, 8]
watermark_slack_s: 30                   # at maximum replay speed no worker runs more than this far ahead of the slowest region's event time
session_timeout_ms: 6000                # how long the broker waits before declaring a killed worker dead
heartbeat_interval_ms: 2000
assignors: [range, cooperative]         # eager (RangeAssignor) against cooperative (CooperativeStickyAssignor)
kill_workers: 4
kill_runs: 5                            # K runs per assignor, seeds 0..4
kill_at_hour: 9                         # the kill point: event time 09:00 plus 30 min per seed; replay ends at 12:00
kill_until_hour: 12
kill_victim_partition: 0                # the worker owning this partition is killed (the busiest region)
latency_window: ["21:00", "21:15"]      # match latency at x1 replay speed: paced over this window of the peak hour, N = 4
